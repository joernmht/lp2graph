[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "lp2graph"
version = "0.3.0"
description = "Typed-graph representation of LP, MIP, and MILP formulations."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "lp2graph contributors" }]
keywords = ["optimization", "linear-programming", "milp", "graph", "gnn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
networkx = ["networkx>=3.0"]
pyg = ["torch>=2.0", "torch_geometric>=2.4"]
# DGL publishes no cp313 wheel in any 2.x release and no sdist at all
# (last PyPI upload 2024-05-13), so an unmarked `dgl` requirement makes
# this extra unresolvable on Python 3.13 -- which `requires-python` and
# the CI matrix both advertise. The marker keeps the extra installable
# where wheels exist and inert where they do not; `export/dgl.py` is
# lazily imported (ADR-0007), so the feature simply stays unavailable.
dgl = ['dgl>=2.0; python_version < "3.13"', "torch>=2.0"]
pyomo = ["pyomo>=6.7"]
solver = ["pulp>=2.8", "highspy>=1.7"]
# `lp2graph.interop.from_gurobipy` / `to_gurobipy` drive a live gurobipy
# model. Gurobi is commercial and needs a licence, so it is deliberately
# NOT part of `all`; `pip install "lp2graph[gurobi]"` opts in explicitly.
gurobi = ["gurobipy>=11.0"]
# Optional accelerators for the lp2graph.mining extensions (M1-M6). The mining
# package imports and runs without these; they only enable optional backends
# (M1 Pyomo import, M3 HDBSCAN, M2 WordNet, M6 NetworkX isomorphism).
mining = ["networkx>=3.0", "pyomo>=6.7", "nltk>=3.8", "hdbscan>=0.8"]
# Every non-commercial optional backend that resolves on every supported
# Python. `gurobi` is excluded because it is commercial and licence-gated;
# `dgl` because it has no Python 3.13 wheel and no sdist, and one
# unresolvable member makes the whole extra -- and therefore every other
# backend in it -- uninstallable. Install it deliberately with
# `pip install "lp2graph[dgl]"` on Python 3.11/3.12. See ADR-0014.
all = [
    "networkx>=3.0",
    "torch>=2.0",
    "torch_geometric>=2.4",
    "pyomo>=6.7",
    "pulp>=2.8",
    "highspy>=1.7",
    "nltk>=3.8",
    "hdbscan>=0.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.15.12,<0.16",
    "mypy>=1.10",
    "jsonschema>=4.0",
    "networkx>=3.0",
    "pre-commit>=3.6",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.scripts]
lp2graph = "lp2graph.cli:main"

[project.urls]
Homepage = "https://github.com/joernmht/lp2graph"
Documentation = "https://github.com/joernmht/lp2graph#readme"
Issues = "https://github.com/joernmht/lp2graph/issues"
Source = "https://github.com/joernmht/lp2graph"

[tool.hatch.build.targets.wheel]
packages = ["src/lp2graph"]

# The canonical JSON Schema is the published contract of the interchange
# format, so it must travel with the wheel -- not only with the git
# checkout (ADR-0013). The repo-root copy stays the single source of
# truth (its `$id` URL is public); this maps it into the package so
# `lp2graph.schema.canonical_schema()` resolves after `pip install`.
[tool.hatch.build.targets.wheel.force-include]
"schema/canonical.schema.json" = "lp2graph/schema/canonical.schema.json"

[tool.hatch.build.targets.sdist]
include = [
    "src/lp2graph",
    "schema",
    "formulations",
    "docs",
    "tests",
    "examples",
    "viewer",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CITATION.cff",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["lp2graph"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/lp2graph"]
plugins = ["pydantic.mypy"]
exclude = ["legacy/"]

[[tool.mypy.overrides]]
module = ["networkx.*", "torch.*", "torch_geometric.*", "dgl.*", "pyomo.*", "jsonschema.*", "pulp.*", "highspy.*", "nltk.*", "hdbscan.*", "gurobipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/lp2graph"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
